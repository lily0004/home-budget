<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 집 장바구니</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf7ef;color:#30283b;font:18px/1.6 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:24px}header{padding:24px;background:#e9def7;border-radius:24px;margin-bottom:20px}h1,h2,p{margin:0 0 12px}h1{font-size:clamp(28px,5vw,42px)}h2{font-size:23px}small{font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.panel,.metric{background:white;border:1px solid #e6dfed;border-radius:18px;padding:20px;min-width:0}.metric{background:#f0e8fa}.metric:nth-child(2){background:#fff0d9}.metric:nth-child(3){background:#e8f2e8}.metric strong{display:block;font-size:clamp(20px,2.4vw,30px);overflow-wrap:anywhere}label{display:block;font-weight:650;margin:8px 0}input,select,button{font:inherit;border-radius:10px;min-height:48px;padding:9px 12px}input,select{width:100%;border:1px solid #9d91ad;background:#fff;color:inherit}button{border:0;background:#65438e;color:white;cursor:pointer;font-weight:650}button.secondary{background:#eee6f7;color:#493065}button.danger{background:#a23d48}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b18bdf;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.track{height:14px;background:#eee9f2;border-radius:12px;overflow:hidden}.fill{height:100%;border-radius:12px}.line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.legend{display:grid;gap:8px}.dot{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px}.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut svg{width:190px;max-width:100%;margin:auto}.legend{flex:1;min-width:180px}.bar{margin:12px 0}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee}td:nth-child(4){text-align:right}td button{font-size:16px;min-height:42px;margin:2px}.notice{padding:12px;border-radius:10px;background:#f1ebfa;margin-bottom:16px}.warn{background:#ffe5e5;color:#8b2330}#storage:empty,#message:empty{display:none}#report{width:100%;min-height:180px;font:inherit} [hidden]{display:none!important}@media(max-width:700px){main{padding:12px}.grid,.metrics{grid-template-columns:1fr}.panel,.metric{padding:16px}.metric strong{font-size:28px}.actions button{flex:1 1 auto}header{padding:18px}}@media(prefers-reduced-motion:no-preference){.fill{transition:width .2s}}
</style></head><body><main><header><small>생활 속 데이터 분석 · 디지털 실습</small><h1>🛒 우리 집 장바구니</h1><p>생활비 분석 대시보드</p><small>수업용 가상 데이터로 시작하세요. 계좌번호나 카드번호는 입력하지 마세요. 데이터는 이 브라우저에만 저장됩니다.</small></header><div id="storage" class="notice warn" role="alert"></div><div class="metrics"><div class="metric">생활비 예산<strong id="mBudget"></strong></div><div class="metric">전체 지출액<strong id="mTotal"></strong></div><div class="metric">남은 예산<strong id="mLeft"></strong></div><div class="metric">예산 사용률<strong id="mRate"></strong><div class="track"><div id="progress" class="fill" style="background:#9674c5"></div></div></div></div><div id="warning" class="notice" role="status"></div><div class="grid"><section class="panel"><h2>1. 생활비 예산 설정</h2><form id="budgetForm"><label for="budget">전체 예산 (원)</label><input id="budget" type="number" min="0" step="1" required inputmode="numeric"><div class="actions"><button>예산 저장</button></div></form><hr style="border:0;border-top:1px solid #eee;margin:24px 0"><h2 id="formTitle">2. 지출 내역 추가</h2><form id="expenseForm"><label for="date">지출 날짜</label><input id="date" type="date" required><label for="desc">지출 내용</label><input id="desc" maxlength="200" placeholder="예: 마트 장보기" required><label for="category">지출 분류</label><select id="category"></select><label for="amount">지출 금액 (원)</label><input id="amount" type="number" min="1" step="1" inputmode="numeric" required placeholder="예: 85000"><div class="actions"><button id="saveExpense">지출 추가</button><button type="button" id="cancel" class="secondary" hidden>수정 취소</button></div></form><p id="message" class="notice" role="status"></p></section><section class="panel"><h2>3. 항목별 지출 비율</h2><div class="donut"><svg id="donut" viewBox="0 0 160 160" role="img" aria-label="항목별 지출 도넛 차트"></svg><div id="legend" class="legend"></div></div><h2 style="margin-top:24px">4. 항목별 지출 금액</h2><div id="bars"></div></section></div><section class="panel"><h2>5. 지출 내역 검색</h2><div class="grid"><div><label for="from">시작 날짜</label><input type="date" id="from"></div><div><label for="to">종료 날짜</label><input type="date" id="to"></div><div><label for="filterCategory">분류 선택</label><select id="filterCategory"><option value="">전체 분류</option></select></div><div><label for="query">내용 검색</label><input id="query" placeholder="검색어 입력"></div></div><div class="actions"><button id="clearFilter" class="secondary">검색 조건 지우기</button></div><p id="filterSummary" aria-live="polite"></p><small>상단 지표와 그래프는 전체 지출 기준입니다. 검색은 아래 표에 적용됩니다.</small><div class="scroll"><table><thead><tr><th>날짜</th><th>내용</th><th>분류</th><th>금액</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="copy">전체 보고서 복사</button><button id="csv">전체 CSV 다운로드</button><button id="sample" class="secondary">예시 데이터 복원</button><button id="reset" class="danger">전체 초기화</button></div><div id="reportBox" hidden><label for="report">보고서 (직접 복사 가능)</label><textarea id="report" readonly></textarea></div></section></main><script>
'use strict';
const $=id=>document.getElementById(id), cats=['식비','생활용품','교통비','여가비','기타'], colors=['#9874c8','#d8a052','#579b8d','#c77e9b','#9298aa'], key='basket-dashboard-v1';
const won=n=>n.toLocaleString('ko-KR')+'원'; const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
function examples(){return {budget:500000,items:[['마트 장보기','식비',85000],['세제와 휴지','생활용품',35000],['대중교통','교통비',25000],['카페와 영화','여가비',45000],['시장 장보기','식비',60000]].map(([desc,category,amount])=>({id:uid(),date:today(),desc,category,amount}))}};
let state=examples(), editing=null; const validAmount=n=>Number.isSafeInteger(n)&&n>0; const validBudget=n=>Number.isSafeInteger(n)&&n>=0; const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
try{const raw=localStorage.getItem(key);if(raw){const s=JSON.parse(raw);if(!validBudget(s.budget)||!Array.isArray(s.items)||!s.items.every(x=>x&&typeof x.id==='string'&&validDate(x.date)&&typeof x.desc==='string'&&cats.includes(x.category)&&validAmount(x.amount))||!Number.isSafeInteger(s.items.reduce((a,x)=>a+x.amount,0)))throw Error('invalid');state=s}}catch(e){$('storage').textContent='저장 데이터를 읽을 수 없습니다. 현재 화면은 예시 데이터입니다. CSV로 별도 보관하세요.'}
function persist(){try{localStorage.setItem(key,JSON.stringify(state));$('storage').textContent=''}catch(e){$('storage').textContent='자동 저장 실패: 새로고침하면 데이터가 사라질 수 있습니다. CSV로 저장하세요.'}}
function msg(s){$('message').textContent=s}function option(s){const o=document.createElement('option');o.value=s;o.textContent=s;return o}cats.forEach(c=>{$('category').append(option(c));$('filterCategory').append(option(c))});
function total(){return state.items.reduce((a,x)=>a+x.amount,0)}function groups(){return cats.map((name,i)=>({name,color:colors[i],sum:state.items.filter(x=>x.category===name).reduce((a,x)=>a+x.amount,0)}))}function pct(n,t){return t? n/t*100:0}function fmt(n){return n.toLocaleString('ko-KR',{maximumFractionDigits:1})+'%'}
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function svg(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}
function render(){const t=total(),b=state.budget,r=b?pct(t,b):0;$('mBudget').textContent=won(b);$('mTotal').textContent=won(t);$('mLeft').textContent=won(b-t);$('mRate').textContent=b?fmt(r):'예산 미설정';$('progress').style.width=Math.min(100,r)+'%';$('warning').className='notice'+(t>b?' warn':'');$('warning').textContent=t>b?'⚠ 예산을 '+won(t-b)+' 초과했습니다.'+(b===0?' 예산을 설정하면 사용률을 확인할 수 있습니다.':''):b===0?'예산을 설정하면 사용률을 확인할 수 있습니다.':'예산 범위 안에서 지출하고 있습니다.';
const g=groups(),d=$('donut');d.replaceChildren(svg('circle',{cx:80,cy:80,r:59,fill:'none',stroke:'#eee9f2','stroke-width':24}));let offset=0;$('legend').replaceChildren();$('bars').replaceChildren();g.forEach(x=>{const p=pct(x.sum,t);if(p>0)d.append(svg('circle',{cx:80,cy:80,r:59,fill:'none',stroke:x.color,'stroke-width':24,pathLength:100,'stroke-dasharray':`${p} ${100-p}`,'stroke-dashoffset':-offset,transform:'rotate(-90 80 80)'}));offset+=p;const l=el('div'),dot=el('span',undefined,'dot');dot.style.background=x.color;l.append(dot,document.createTextNode(`${x.name} ${won(x.sum)} (${fmt(p)})`));$('legend').append(l);const bar=el('div',undefined,'bar'),line=el('div',undefined,'line'),track=el('div',undefined,'track'),fill=el('div',undefined,'fill');line.append(el('span',x.name),el('strong',won(x.sum)));fill.style.background=x.color;fill.style.width=p+'%';track.append(fill);bar.append(line,track);$('bars').append(bar)});d.append(svg('text',{x:80,y:76,'text-anchor':'middle','font-size':12,fill:'#30283b'},t?'전체 지출':'지출 없음'),svg('text',{x:80,y:94,'text-anchor':'middle','font-size':11,fill:'#30283b','font-weight':'bold'},won(t)));renderRows();$('reportBox').hidden=true}
function renderRows(){const f=$('from').value,to=$('to').value,c=$('filterCategory').value,q=$('query').value.trim().toLowerCase();const list=state.items.filter(x=>(!f||x.date>=f)&&(!to||x.date<=to)&&(!c||x.category===c)&&(!q||x.desc.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));$('filterSummary').textContent=f&&to&&f>to?'시작 날짜가 종료 날짜보다 늦습니다.':`검색 결과 ${list.length}건 · ${won(list.reduce((a,x)=>a+x.amount,0))}`;const body=$('rows');body.replaceChildren();if(!list.length){const tr=el('tr'),td=el('td','표시할 지출 내역이 없습니다.');td.colSpan=5;tr.append(td);body.append(tr)}list.forEach(x=>{const tr=el('tr');[x.date,x.desc,x.category,won(x.amount)].forEach(v=>tr.append(el('td',v)));const td=el('td'),edit=el('button','수정','secondary'),del=el('button','삭제','danger');edit.onclick=()=>{editing=x.id;$('date').value=x.date;$('desc').value=x.desc;$('category').value=x.category;$('amount').value=x.amount;$('formTitle').textContent='2. 지출 내역 수정';$('saveExpense').textContent='수정 저장';$('cancel').hidden=false;$('desc').focus()};del.onclick=()=>{if(confirm('이 지출 내역을 삭제할까요?')){state.items=state.items.filter(y=>y.id!==x.id);if(editing===x.id)clearForm();persist();render();msg('삭제했습니다.')}};td.append(edit,del);tr.append(td);body.append(tr)})}
function clearForm(){editing=null;$('expenseForm').reset();$('date').value=today();$('formTitle').textContent='2. 지출 내역 추가';$('saveExpense').textContent='지출 추가';$('cancel').hidden=true}function clearFilters(){['from','to','filterCategory','query'].forEach(id=>$(id).value='');renderRows()}
$('budgetForm').onsubmit=e=>{e.preventDefault();const n=Number($('budget').value);if(!validBudget(n)){msg('예산은 0 이상의 안전한 정수로 입력하세요.');return}state.budget=n;persist();render();msg('예산을 저장했습니다.')};$('expenseForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value),desc=$('desc').value.trim(),date=$('date').value,category=$('category').value;if(!validAmount(amount)||!desc||!validDate(date)||!cats.includes(category)){msg('날짜와 내용을 확인하고 금액은 양의 정수로 입력하세요.');return}const old=state.items.find(x=>x.id===editing);if(!Number.isSafeInteger(total()-(old?.amount||0)+amount)){msg('전체 금액이 너무 큽니다.');return}const x={id:editing||uid(),date,desc,category,amount};if(editing)state.items=state.items.map(y=>y.id===editing?x:y);else state.items.push(x);const was=editing;clearForm();persist();render();msg(was?'수정했습니다.':'지출을 추가했습니다.')};$('cancel').onclick=()=>{clearForm();msg('수정을 취소했습니다.')};['from','to','filterCategory','query'].forEach(id=>$(id).addEventListener('input',renderRows));$('clearFilter').onclick=clearFilters;
function replaceState(s){state=s;$('budget').value=s.budget;clearForm();clearFilters();persist();render();msg('변경했습니다.')}$('reset').onclick=()=>{if(confirm('예산과 모든 지출을 삭제할까요? 되돌릴 수 없습니다.'))replaceState({budget:0,items:[]})};$('sample').onclick=()=>{if(confirm('현재 데이터를 지우고 예시 데이터로 바꿀까요?'))replaceState(examples())};
function report(){const t=total();return ['우리 집 장바구니 생활비 보고서','작성일: '+today(),'예산: '+won(state.budget),'전체 지출: '+won(t),'남은 예산: '+won(state.budget-t),'사용률: '+(state.budget?fmt(pct(t,state.budget)):'예산 미설정'),...(t>state.budget?['예산 초과: '+won(t-state.budget)]:[]),'','항목별 지출',...groups().map(x=>`${x.name}: ${won(x.sum)} (${fmt(pct(x.sum,t))})`),'','전체 지출 내역',...state.items.map(x=>`${x.date} | ${x.desc} | ${x.category} | ${won(x.amount)}`)].join('\n')}$('copy').onclick=async()=>{const s=report();$('reportBox').hidden=false;$('report').value=s;$('report').focus();$('report').select();try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(s);else if(!document.execCommand('copy'))throw Error();alert('보고서를 복사했습니다.')}catch(e){alert('자동 복사가 제한됩니다. 선택된 보고서를 직접 복사하세요.')}};
function csvCell(v){let s=String(v);if(/^[\s\uFEFF]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}$('csv').onclick=()=>{const lines=[['날짜','내용','분류','금액'],...state.items.map(x=>[x.date,x.desc,x.category,x.amount])].map(r=>r.map(csvCell).join(','));const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='우리집_장바구니_'+today()+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('budget').value=state.budget;clearForm();render();if(!$('storage').textContent)persist();
</script></body></html>
